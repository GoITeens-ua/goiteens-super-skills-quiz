<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Який суперскіл у вашої дитини? Тест для батьків</title>
<meta name="description" content="7 запитань і 3 практичні рекомендації для батьків.">
<meta property="og:title" content="Який суперскіл у вашої дитини?">
<meta property="og:description" content="Квіз для батьків: 7 запитань, 2–3 хвилини.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B1F3B; --ink:#2B2F4A; --muted:#6B6F86; --cream:#FFF8F0; --card:#FFFFFF;
    --line:#ECE6DD; --accent:#FF6B35; --accent-d:#E85A26;
    --K:#FF6B35; --S:#3A6FF7; --V:#8B5CF6; --M:#1FA971; --B:#E9A400;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;min-height:100vh}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .brand img{height:28px;width:auto;display:block}
  .brand span{font-weight:700;font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
  .card{background:var(--card);border-radius:24px;padding:28px 24px;box-shadow:0 10px 30px rgba(27,31,59,.07)}
  h1{font-size:30px;line-height:1.15;margin:0 0 12px;color:var(--navy);font-weight:800}
  h2{font-size:21px;line-height:1.3;margin:0 0 20px;color:var(--navy);font-weight:700}
  h3{font-size:16px;margin:0 0 8px;color:var(--navy);font-weight:700}
  p{margin:0 0 12px}
  .lead{color:var(--muted);font-size:16px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}
  .pill{background:var(--cream);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--navy)}
  .label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font:inherit;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s}
  .chip:hover{border-color:#d9cfc2}
  .chip.on{border-color:var(--accent);background:#FFF1EA;color:var(--accent-d)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:16px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:.15s}
  .btn-main{background:var(--accent);color:#fff;width:100%;margin-top:24px}
  .btn-main:hover{background:var(--accent-d)}
  .btn-main:disabled{background:#F3C4B0;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
  .note{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
  .notice{background:#EAF7F1;color:#13774F;border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:8px}
  /* quiz */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .back{background:none;border:0;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0}
  .back[hidden]{display:block;visibility:hidden}
  .count{font-weight:700;color:var(--muted);font-size:14px}
  .bar{height:8px;background:#F1EBE2;border-radius:999px;overflow:hidden;margin-bottom:22px}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font:inherit;font-size:15.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:.15s}
  .opt:hover{border-color:#d9cfc2;transform:translateY(-1px)}
  .opt.on{border-color:var(--accent);background:#FFF1EA}
  .opt b{flex:0 0 28px;height:28px;border-radius:9px;background:var(--cream);display:grid;place-items:center;font-size:13px;color:var(--navy)}
  .opt.on b{background:var(--accent);color:#fff}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* result */
  .badge{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;font-size:44px;margin-bottom:16px}
  .kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
  .tagline{font-size:17px;font-weight:600;margin-bottom:14px}
  .box{border-radius:18px;padding:18px;margin-top:16px}
  .box.soft{background:var(--cream)}
  .box.grow{background:#F3F0FF}
  .box.cta{background:var(--navy);color:#fff}
  .box.cta h3{color:#fff;font-size:19px}
  .box.cta p{color:#D9DBEA}
  .bars{display:grid;gap:10px;margin-top:6px}
  .brow{display:grid;grid-template-columns:140px 1fr 22px;align-items:center;gap:10px;font-size:14px;font-weight:600;white-space:nowrap}
  .btrack{height:10px;background:#F1EBE2;border-radius:999px;overflow:hidden}
  .btrack span{display:block;height:100%;border-radius:999px;width:0;transition:width .8s ease}
  .bval{text-align:right;color:var(--muted);font-size:13px}
  .tip{display:flex;gap:10px;margin-top:10px;font-size:15px}
  .tip::before{content:"🏡";flex:0 0 auto}
  .actions{display:grid;gap:10px;margin-top:18px}
  .box.cta .btn-main{margin-top:14px}
  .btn-light{background:#fff;color:var(--navy)}
  .small{font-size:13px;color:var(--muted)}
  @media (max-width:420px){h1{font-size:26px}.card{padding:24px 18px}.brow{grid-template-columns:128px 1fr 18px;font-size:13px;gap:8px}}
  .role-duo{display:flex;gap:10px;align-items:stretch;margin:12px 0 16px}
  .role-mini{flex:1;min-width:0;background:var(--cream);border-radius:16px;padding:14px;text-align:center}
  .role-mini .emoji{font-size:32px;display:block;margin-bottom:4px}
  .role-mini h3{margin:0 0 3px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .result-section{margin:22px 0 0}
  .result-section h2{font-size:20px;margin-bottom:8px}
  .soft-list{display:grid;gap:10px;margin-top:12px}
  .soft-list > div{background:#FFF8F0;border-radius:14px;padding:13px 15px;font-size:14px}
  .tip-card{background:#F3F0FF;padding:16px;border-radius:16px;margin-top:10px}
  .tip-card strong{display:block;margin-bottom:7px;color:var(--navy)}
  .tip-card p{font-size:14px;margin:0}
  .muted-callout{background:var(--cream);border-radius:14px;padding:13px 15px;color:var(--ink);font-size:14px;margin-top:12px}
  .info{font-size:13px;color:var(--muted);margin-top:16px}
  @media(max-width:420px){.role-duo{gap:8px}.role-mini{padding:12px 8px}}

  /* Компактний екран проходження: менше висоти без втрати зручності натискання. */
  .wrap{max-width:610px;padding:12px 14px 28px;min-height:unset}
  .brand{margin-bottom:12px}
  .quiz-card{padding:20px 20px 18px;border-radius:20px}
  .quiz-card .top{margin-bottom:9px}
  .quiz-card .back{font-size:14px}
  .quiz-card .count{font-size:13px}
  .quiz-card .bar{height:6px;margin-bottom:15px}
  .quiz-card h2{font-size:19px;line-height:1.27;margin-bottom:15px}
  .quiz-card .opts{gap:7px}
  .quiz-card .opt{min-height:46px;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.35;gap:10px;align-items:center}
  .quiz-card .opt b{flex-basis:24px;height:24px;border-radius:8px;font-size:12px}
  .quiz-card .note{font-size:11.5px;margin-top:10px}
  @media(max-width:420px){.quiz-card{padding:17px 14px}.quiz-card h2{font-size:18px}.quiz-card .opt{padding:9px 10px;font-size:13.5px}}

  /* Результат: чітка ієрархія, компактні тематичні картки та друкований варіант. */
  .result-page{padding:24px 24px 20px;overflow:hidden}
  .result-topline{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:800;text-transform:uppercase;margin-bottom:10px}
  .result-topline .result-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  .result-page > h1{font-size:27px;letter-spacing:-.035em;line-height:1.16;margin:0 0 16px}
  .result-page .role-duo{margin:0;gap:10px}
  .result-page .role-mini{background:linear-gradient(135deg,#FFF6EE,#FFF0E2);border:1px solid #F7E8DA;border-radius:19px;padding:19px 12px}
  .result-page .role-mini .emoji{font-size:39px;margin-bottom:8px}
  .result-page .role-mini h3{font-size:20px;margin-bottom:5px}
  .result-page .role-mini .small{font-size:13px}
  .role-description{font-size:14px;line-height:1.58;color:var(--ink);margin:12px 1px 0}
  .role-disclaimer{font-size:11px;color:var(--muted);margin:7px 1px 0}
  .result-feature{margin-top:20px;background:#FFF8F0;border:1px solid #F4E9DC;border-radius:20px;padding:19px 17px 17px}
  .result-feature.bonus{background:#F5F3FF;border-color:#EBE6FF}
  .section-header{display:flex;align-items:center;gap:11px;margin-bottom:15px}
  .section-icon{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:#FFE6D7;color:#C94F18;display:grid;place-items:center;font-size:21px}
  .bonus .section-icon{background:#E6DFFF;color:#6745C8}
  .section-kicker{font-size:10px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:#A76039;margin:0 0 3px}
  .bonus .section-kicker{color:#7055B9}
  .section-heading{font-size:19px;letter-spacing:-.02em;line-height:1.25;color:var(--navy);margin:0}
  .result-feature .soft-list{display:grid;gap:8px;margin:0}
  .result-feature .soft-list > div{background:white;border:1px solid #F2E7DC;border-radius:13px;padding:12px 13px;font-size:13px;line-height:1.5}
  .result-feature .soft-list strong{display:block;font-size:14px;color:var(--navy);margin-bottom:3px}
  .result-feature .soft-list > div div{margin-top:0!important;color:#586078}
  .result-feature > p{font-size:13px;line-height:1.55}
  .bonus-summary{color:#636682;font-size:12px;margin:0 0 13px;line-height:1.5}
  .bonus-grid{display:grid;gap:9px}
  .bonus-grid .tip-card{display:flex;align-items:flex-start;gap:11px;margin:0;border-radius:14px;background:#fff;border:1px solid #E8E2FC;padding:13px 14px}
  .tip-counter{flex:0 0 27px;height:27px;width:27px;border-radius:9px;background:#eee7ff;color:#6546B5;font-size:13px;font-weight:800;display:grid;place-items:center}
  .tip-content{flex:1;min-width:0}
  .bonus-grid .tip-card strong{font-size:14px;margin:1px 0 5px;color:var(--navy);line-height:1.35}
  .bonus-grid .tip-card p{font-size:13px;line-height:1.55;color:#555D77}

  /* Персональний PDF-подарунок після трьох рекомендацій. */
  .gift-panel{margin-top:18px;display:flex;gap:15px;align-items:flex-start;border:1px solid #DAEADf;background:#F0F8F2;border-radius:19px;padding:20px}
  .gift-symbol{display:grid;place-items:center;flex:0 0 48px;height:48px;border-radius:15px;background:#DBEFE2;font-size:25px}
  .gift-content{flex:1;min-width:0}
  .gift-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#39815A;margin-bottom:6px}
  .gift-panel h3{font-size:19px;line-height:1.28;color:var(--navy);margin:0 0 9px}
  .gift-panel p{font-size:13px;line-height:1.6;margin:0 0 12px;color:#485A53}
  .gift-button{display:inline-flex;align-items:center;justify-content:center;background:#18764B;color:#fff;text-decoration:none;border-radius:12px;font-size:13px;font-weight:800;min-height:44px;padding:11px 15px;max-width:100%;text-align:center}
  .gift-button:hover{background:#12613D}
  .gift-hint{margin:7px 0 0!important;font-size:11px!important;color:#64766c!important}
  @media(max-width:420px){.gift-panel{padding:15px 13px;gap:11px}.gift-symbol{flex-basis:39px;height:39px;font-size:21px}.gift-panel h3{font-size:17px}.gift-button{width:100%}}
  .course-panel{margin-top:18px;border-radius:19px;background:var(--navy);padding:19px;color:#fff}
  .course-panel .course-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#FFAD8D;margin:0 0 7px}
  .course-panel h3{color:#fff;font-size:19px;margin:0 0 9px;letter-spacing:-.02em}
  .course-panel p{font-size:13px;color:#D9DBEA;line-height:1.58;margin:0 0 12px}
  .course-panel .btn-light{margin:12px 0 0!important;width:100%;min-height:47px;padding:12px 15px;font-size:14px;border-radius:12px}
  .result-page .info{font-size:11px;line-height:1.5;text-align:center;margin:14px 3px 0}
  .result-actions{display:grid;grid-template-columns:1.15fr 1fr;gap:9px;margin-top:14px}
  .result-actions .btn{min-height:45px;padding:10px 11px;font-size:12.5px;border-radius:12px}
  .btn-save{background:#fff;border:1.5px solid #D7D9E5;color:var(--navy)}
  .btn-save:hover{background:#F6F5FF}
  .pdf-note{margin-top:7px;color:var(--muted);font-size:10.5px;text-align:center}
  @media(max-width:420px){.result-page{padding:19px 15px}.result-page > h1{font-size:24px}.section-heading{font-size:17px}.result-feature{padding:15px 12px}.course-panel{padding:16px 13px}.result-actions{grid-template-columns:1fr}.result-actions .btn{font-size:13px}}
  @media print{
    @page{size:A4;margin:12mm}
    html,body{background:#fff!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .wrap{max-width:none!important;width:100%!important;padding:0!important;min-height:0!important}
    .brand{margin-bottom:10px}
    .card.result-page{max-width:none!important;border-radius:0!important;box-shadow:none!important;padding:0!important}
    .result-feature,.course-panel,.role-mini,.tip-card{break-inside:avoid;page-break-inside:avoid}
    .result-feature{margin-top:14px}
    .course-panel,.gift-panel,.result-actions,.pdf-note,.print-hide{display:none!important}
    .role-disclaimer,.result-page .info{font-size:9px}
    .result-feature .soft-list{gap:5px}
    .bonus-grid{gap:6px}
    a{text-decoration:none}
  }
</style>
</head>

 for(let i=0;i<7;i++){
   const a=answers[i];
   if(a===null||a===undefined||isUnknown(age,i,a))continue;
   const key=qs[i].roles?.[a] || ROLE_HINTS[age]?.[i]?.[a] ||
     (i===0 && a===5 && age==='13-17' ? 'V' : null);
   if(key)firstSignal.push(key);
 }
 const primary=winners.length?firstSignal.find(k=>winners.includes(k)):null;
 const roles=primary?[primary]:[];
 // Один сюжет — одна рекомендація. Не використовуємо сумнівні відсотки «сили навички».
 const ranked=observations.slice().sort((a,b)=>b.score-a.score||a.index-b.index);
 const selections=[];
 if(contact.length&&TIPS[age].contact)selections.push({key:'contact',kind:'contact'});
 const candidates=[...ranked.map(x=>({key:x.topic,kind:'difficulty'})),...positive.map(x=>({key:x.topic,kind:'practice'}))];
 for(const candidate of candidates){if(selections.length>=3)break;if(!selections.some(x=>x.key===candidate.key))selections.push(candidate);}
 // Якщо труднощів мало або відповіді невідомі, додаємо нейтральні практики з тем програми.
 for(const key of TOPICS[age]){if(selections.length>=3)break;if(!selections.some(x=>x.key===key))selections.push({key,kind:'practice'});}
 return {scores,winners,roles,highest,signalCount,concernCount,observations,positive,unknown,contact,selections:selections.slice(0,3)};
}

// Універсальні PDF-подарунки, заздалегідь завантажені на Google Диск.
// На сторінці результату показуємо ОДИН файл, який відповідає віку й відповідям.
const PDF_GIFTS={
  conversation:{
    title:'20 питань за вечерею замість «Як у школі?»',
    url:'https://drive.google.com/file/d/1jPSmYS4LZcwxhmrp8rCRJXsJw4bPgJQM/view?usp=sharing',
    description:'Готові запитання для щирих розмов про інтереси, почуття, дружбу та мрії — без допитів і оцінювання.'
  },
  phrases:{
    title:'12 фраз, які ми кажемо дітям щодня, і чим їх замінити',
    url:'https://drive.google.com/file/d/12CINv-T3mCqyiGSLFYEgx_Ozobd3eyck/view?usp=drive_link',
    description:'Коротка шпаргалка для ситуацій, коли дитина сердиться, помиляється, сперечається або потребує підтримки.'
  },
  roadmap:{
    title:'Вікова карта софт-скілів: 10, 13 і 16 років',
    url:'https://drive.google.com/file/d/1_8GxJWmLmIhVD7Ul_KPCR6f7_K2SDsba/view?usp=sharing',
    description:'Зручний чек-лист, щоб разом помічати прогрес у спілкуванні, самостійності, ухваленні рішень та інших навичках.'
  }
};
function pickPdfGift(age,result){
  // Батьки прямо зазначили, що мало знають про інтереси чи переживання дитини.
  // Це найсильніший сигнал для карток із розмовами, незалежно від інших труднощів.
  if(result.contact.length) return PDF_GIFTS.conversation;
  const difficulties=new Set(result.observations.map(x=>x.topic));
  if(age==='7-8'){
    // Картка 10/13/16 не релевантна семирічним і восьмирічним дітям.
    return difficulties.has('friendship') && !difficulties.has('emotion') && !difficulties.has('organization')
      ?PDF_GIFTS.conversation:PDF_GIFTS.phrases;
  }
  if(age==='9-10'){
    if(difficulties.has('screens') || difficulties.has('confidence') || difficulties.has('boundaries')) return PDF_GIFTS.phrases;
    if(difficulties.has('organization') || difficulties.has('money')) return PDF_GIFTS.roadmap;
    return PDF_GIFTS.roadmap;
  }
  if(age==='11-12'){
    if(difficulties.has('peers') || difficulties.has('voice')) return PDF_GIFTS.conversation;
    if(difficulties.has('mistakes') || difficulties.has('selfworth')) return PDF_GIFTS.phrases;
    return PDF_GIFTS.roadmap;
  }
  // 13–17: питання для контакту і карта вікових навичок — найбільш придатні.
  if(difficulties.has('voice') || difficulties.has('feedback')) return PDF_GIFTS.conversation;
  return PDF_GIFTS.roadmap;
}

function renderResult(){
 const age=state.age,r=evaluate(age,state.ans),course=COURSES[age],ageText=AGES.find(x=>x[0]===age)[1],gift=pickPdfGift(age,r);
 let roleHtml='';
 if(r.roles.length){
  roleHtml=`<div class="role-duo">${r.roles.map(k=>{const a=ROLES[k];return `<div class="role-mini"><span class="emoji">${a.emoji}</span><h3 style="color:${a.color}">${a.name}</h3><span class="small">${a.tag}</span></div>`}).join('')}</div>
   <p class="role-description">${r.roles.length===1?ROLES[r.roles[0]].desc:'У відповідях однаково помітні дві різні сильні сторони. Вони можуть доповнювати одна одну.'}</p>
   <p class="role-disclaimer">Це один із можливих проявів сильних сторін дитини за вашими відповідями, а не оцінка її особистості.</p>`;
 }else{
  roleHtml=`<div class="muted-callout"><strong>Кожна дитина має свої сильні сторони 💛</strong><p style="margin:6px 0 0">Цього разу відповіді більше розповіли про ситуації, у яких дитині потрібна підтримка, ніж про її звичні сильні сторони. Нижче — три практичні ідеї для вашої родини.</p></div>`;

 }
 const headings={"7-8":"Ситуації, на які можна звернути увагу","9-10":"Ситуації, на які можна звернути увагу","11-12":"На що можна звернути увагу","13-17":"На що можна звернути увагу"};
 let observationHtml;
 if(r.observations.length){
  observationHtml=`<div class="soft-list">${r.observations.slice(0,3).map(x=>`<div><strong>${esc(TIPS[age][x.topic][0])}</strong><div style="margin-top:4px">${esc(TIPS[age][x.topic][1])}</div></div>`).join('')}</div>`;
 }else if(r.contact.length){
  observationHtml='<p>Ви зазначили, що не про всі інтереси чи ситуації дитини маєте інформацію. Це не ознака проблеми — просто привід для спокійної розмови.</p>';
 }else{
  observationHtml='<p>Ви не відзначили помітних труднощів у запропонованих ситуаціях. Нижче — ідеї для підтримки й подальшого розвитку навичок.</p>';
 }
 if(r.contact.length&&r.observations.length)observationHtml+='<p class="small" style="margin-top:12px">Деякі ситуації вам поки недостатньо відомі. Ми включили до рекомендацій ідею для розмови з дитиною.</p>';
 const tipHtml=r.selections.map((item,i)=>{const t=TIPS[age][item.key];const desc=item.kind==='difficulty'?t[2]:t[3];return `<div class="tip-card"><span class="tip-counter">${i+1}</span><div class="tip-content"><strong>${esc(t[0])}</strong><p>${esc(desc)}</p></div></div>`}).join('');
 app.innerHTML=`<div class="card result-page fade" id="resultPage">
  <div class="result-topline"><span class="result-dot"></span> Результат квізу · ${ageText}</div>
  <h1>Сильні сторони вашої дитини</h1>
  ${roleHtml}
  <section class="result-feature" aria-labelledby="observationsTitle">
   <div class="section-header"><span class="section-icon" aria-hidden="true">◎</span><div><div class="section-kicker">Ваші спостереження</div><h2 class="section-heading" id="observationsTitle">${headings[age]}</h2></div></div>
   ${observationHtml}
  </section>
  <section class="result-feature bonus" aria-labelledby="bonusTitle">
   <div class="section-header"><span class="section-icon" aria-hidden="true">✦</span><div><div class="section-kicker">Ваш бонус · для вашої родини</div><h2 class="section-heading" id="bonusTitle">3 практичні рекомендації</h2></div></div>
   <p class="bonus-summary">Спробуйте ці прості дії вдома — з урахуванням віку дитини та ваших відповідей.</p>
   <div class="bonus-grid">${tipHtml}</div>
  </section>
  <section class="gift-panel print-hide" aria-labelledby="giftTitle">
   <div class="gift-symbol" aria-hidden="true">🎁</div>
   <div class="gift-content">
     <div class="gift-kicker">Додатковий подарунок від GoITeens</div>
     <h3 id="giftTitle">${esc(gift.title)}</h3>
     <p>${esc(gift.description)}</p>
     <a class="gift-button" href="${esc(gift.url)}" target="_blank" rel="noopener noreferrer">Переглянути та завантажити PDF ↗</a>
     <p class="gift-hint">Відкриється Google Диск, де можна переглянути або завантажити матеріал.</p>
   </div>
  </section>
  <section class="course-panel print-hide"><div class="course-kicker">Продовжити розвиток навичок</div><h3>Як це тренують на заняттях?</h3><p>${esc(course.text)}</p>
   <a class="btn btn-light" href="${esc(course.url)}" target="_blank" rel="noopener noreferrer">Дізнатися більше про курс →</a>
  </section>
  <p class="info">Цей квіз — не психологічна діагностика й не вимірювання рівня навичок. Він допомагає помітити звичні ситуації та знайти ідеї для практики.</p>
  <div class="result-actions print-hide"><button class="btn btn-save" id="saveResult" type="button">↓ Зберегти результат у PDF</button><button class="btn btn-ghost" id="again" type="button">Пройти ще раз</button></div>
  <p class="pdf-note print-hide">Для збереження оберіть у вікні друку «Зберегти як PDF».</p>
 </div>`;
 document.getElementById('again').onclick=()=>{state.ans=Array(7).fill(null);state.prefilled=false;state.i=0;renderStart();window.scrollTo(0,0)};
 document.getElementById('saveResult').onclick=()=>{window.print()};
}
if(state.prefilled&&state.age){state.i=1;renderQ()}else renderStart();

</script>
